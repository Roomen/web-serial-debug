name: Desktop release
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (Markdown)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test desktop/scripts/updater-manifest.test.mjs
      - id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          if (!['main', 'dev'].includes(process.env.REF_NAME)) throw new Error('Publish only from main or dev');
          if (!process.env.UPDATER_KEY || !process.env.UPDATER_PUBLIC_KEY) throw new Error('Updater signing configuration is required');
          const version = readFileSync('js/version.js', 'utf8').match(/APP_VERSION\s*=\s*['"](\d+\.\d+\.\d+)['"]/)[1];
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nchannel=${process.env.REF_NAME}\n`);
          JS
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Require macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node --input-type=module <<'JS'
          for (const name of ['APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_SIGNING_IDENTITY', 'APPLE_ID', 'APPLE_PASSWORD', 'APPLE_TEAM_ID']) {
            if (!process.env[name]) throw new Error(`Missing required ${name}`);
          }
          JS
      - name: Import Developer ID certificate into temporary keychain
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/desktop-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          python3 - <<'PYCODE'
          import base64, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'desktop-certificate.p12'), 'wb') as f:
              f.write(base64.b64decode(os.environ['APPLE_CERTIFICATE'], validate=True))
          PYCODE
          security list-keychains -d user > "$RUNNER_TEMP/original-keychains.txt"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/desktop-certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$RUNNER_TEMP/desktop-certificate.p12"
      - run: npm ci
        working-directory: desktop
      - name: Build signed desktop artifacts
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build -- --target ${{ matrix.target }}
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          python3 - <<'PY'
          import os, shlex, subprocess
          path = os.path.join(os.environ['RUNNER_TEMP'], 'original-keychains.txt')
          if os.path.exists(path):
              with open(path) as f: keychains = shlex.split(f.read())
              subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *keychains], check=True)
          PY
          security delete-keychain "$RUNNER_TEMP/desktop-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/desktop-certificate.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: desktop/release/${{ needs.prepare.outputs.channel }}/
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Validate monotonic version and all update assets
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('release-notes.md', process.env.RELEASE_NOTES);
          JS
          # Only a missing channel release is accepted; network/auth failures abort.
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const releases = JSON.parse(readFileSync('releases.json', 'utf8')).flat();
          writeFileSync('pointer-exists', releases.some(r => r.tag_name === `desktop-${process.env.CHANNEL}`) ? 'yes' : 'no');
          JS
          if [ "$(cat pointer-exists)" = yes ]; then
            gh release download "desktop-$CHANNEL" --pattern latest.json --dir previous
          fi
          node desktop/scripts/updater-manifest.mjs artifacts "$VERSION" "$CHANNEL" latest.json previous/latest.json release-notes.md
      - name: Publish immutable version release, then advance channel pointer
        run: |
          TAG="desktop-$CHANNEL-v$VERSION"
          PRERELEASE=()
          if [ "$CHANNEL" = dev ]; then PRERELEASE=(--prerelease); fi
          gh release create "$TAG" artifacts/* --target "$GITHUB_SHA" --draft "${PRERELEASE[@]}" --title "Serial Debug $VERSION ($CHANNEL)" --notes-file release-notes.md
          gh release edit "$TAG" --draft=false
          if [ "$(cat pointer-exists)" = no ]; then
            gh release create "desktop-$CHANNEL" latest.json --target "$GITHUB_SHA" --draft "${PRERELEASE[@]}" --latest=false --title "Desktop $CHANNEL update channel" --notes "Updater channel manifest. Download installers from version releases."
            gh release edit "desktop-$CHANNEL" --draft=false
          else
            node desktop/scripts/update-channel-pointer.mjs "$CHANNEL" latest.json
          fi
