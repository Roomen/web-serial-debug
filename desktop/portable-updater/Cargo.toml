[package]
name = "portable-updater"
# Windows 便携版应用内更新的 helper：应用退出后替换 EXE，然后重启。
# 版本不写在这里，与桌面客户端一样由构建脚本从 js/version.js 取；出包只靠 ZIP 携带。
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "serial-debug-updater"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-update-common = { path = "../portable-update-common" }

# 便携包要小、要能在旧机器上跑，不引入 LTO 之外的额外优化
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
