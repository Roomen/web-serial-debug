[package]
name = "serial-debug"
# 应用版本不写在这里：desktop/scripts/tauri.mjs 每次从 js/version.js 读出后经 --config 传给 tauri
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "serial_debug_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tauri-plugin-updater = "2"
# 本地 MCP 服务：官方 Rust SDK + axum 承载 Streamable HTTP(只绑 127.0.0.1)
rmcp = { version = "3.8", features = ["server", "transport-streamable-http-server", "macros", "schemars"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros"] }
tokio-util = "0.7"
getrandom = "0.4"
subtle = "2"
schemars = "1"
# Windows 便携版应用内更新：计划/结果格式、载荷读取与验签、进程查询与 helper 共用
portable-update-common = { path = "../portable-update-common" }

[dev-dependencies]
# 测试里构造真实便携 ZIP 载荷
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# 真实 MCP 客户端(仅测试)：对假窗口桥做协议互通验证
rmcp = { version = "3.8", features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest = "0.13"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_System_Registry", "Win32_Devices_Communication"] }

[profile.release]
codegen-units = 8
lto = "thin"
opt-level = "s"
strip = true
