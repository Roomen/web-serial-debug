[package]
name = "serial-debug"
# 应用版本不写在这里：desktop/scripts/tauri.mjs 每次从 js/version.js 读出后经 --config 传给 tauri
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "serial_debug_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_System_Registry", "Win32_Devices_Communication"] }

[profile.release]
codegen-units = 8
lto = "thin"
opt-level = "s"
strip = true
