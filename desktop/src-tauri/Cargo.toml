[package]
name = "serial-debug"
# 应用版本不写在这里：desktop/scripts/tauri.mjs 每次从 js/version.js 读出后经 --config 传给 tauri
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "serial_debug_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
